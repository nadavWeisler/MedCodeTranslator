name: Deploy mobile (iOS & Android)

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/refresh-medical-db.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: Target platform
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android

permissions:
  contents: read

concurrency:
  group: mobile-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS Build (${{ inputs.platform || 'all' }} / ${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS
        run: |
          eas build \
            --platform ${{ inputs.platform || 'all' }} \
            --profile ${{ inputs.profile || 'preview' }} \
            --non-interactive
