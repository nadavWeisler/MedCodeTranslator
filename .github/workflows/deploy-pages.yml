name: Deploy web to GitHub Pages

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROD_BRANCH: master
  DEV_BRANCH: dev
  PROD_BASE_URL: /MedCodeTranslator
  DEV_BASE_URL: /MedCodeTranslator/dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch deployment branches
        run: |
          git fetch origin "$PROD_BRANCH:refs/remotes/origin/$PROD_BRANCH"
          if git ls-remote --exit-code --heads origin "$DEV_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$DEV_BRANCH:refs/remotes/origin/$DEV_BRANCH"
          fi

      - name: Build production and development sites
        run: |
          set -euo pipefail

          SITE_ROOT="$RUNNER_TEMP/pages-site"
          PROD_WORKTREE="$RUNNER_TEMP/worktree-$PROD_BRANCH"
          DEV_WORKTREE="$RUNNER_TEMP/worktree-$DEV_BRANCH"

          rm -rf "$SITE_ROOT" "$PROD_WORKTREE" "$DEV_WORKTREE"
          mkdir -p "$SITE_ROOT"

          build_branch() {
            local branch="$1"
            local worktree="$2"
            local base_url="$3"
            local output_dir="$4"

            git worktree add --detach "$worktree" "origin/$branch"
            (
              cd "$worktree"
              npm ci
              MEDCODE_BASE_URL="$base_url" npm run build:web
            )

            mkdir -p "$output_dir"
            cp -R "$worktree/dist/." "$output_dir/"
            cp "$worktree/dist/index.html" "$output_dir/404.html"
            git worktree remove --force "$worktree"
          }

          build_branch "$PROD_BRANCH" "$PROD_WORKTREE" "$PROD_BASE_URL" "$SITE_ROOT"

          if git show-ref --verify --quiet "refs/remotes/origin/$DEV_BRANCH"; then
            build_branch "$DEV_BRANCH" "$DEV_WORKTREE" "$DEV_BASE_URL" "$SITE_ROOT/dev"
          fi

          touch "$SITE_ROOT/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
