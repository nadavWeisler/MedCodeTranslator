name: Refresh medical code database

on:
  workflow_dispatch:
    inputs:
      create_pull_request:
        description: Create or update an automated PR with regenerated assets
        required: false
        default: true
        type: boolean
  schedule:
    # Runs weekly on Mondays at 04:00 UTC
    - cron: '0 4 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-medical-db
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh data and rebuild database assets
        run: |
          python3 scripts/refresh_medical_db.py \
            --assets-dir data/vocabularies \
            --artifact-dir build/medical-db \
            --report-file build/medical-db/update-report.md

      - name: Publish refresh report to job summary
        if: always()
        run: |
          if [ -f build/medical-db/update-report.md ]; then
            cat build/medical-db/update-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate crosswalk integrity
        if: success()
        run: |
          python3 agents/crosswalk-validator/validate_crosswalk.py \
            --icd9-json data/vocabularies/icd9.json \
            --icd10-json data/vocabularies/icd10.json \
            --crosswalk-json data/vocabularies/icd9_to_icd10_gem.json

      - name: Upload refreshed DB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: medical-code-db
          path: build/medical-db

      - name: Create refresh PR
        if: success() && (github.event_name == 'schedule' || inputs.create_pull_request)
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-medical-db
          commit-message: 'chore(data): refresh medical code datasets'
          title: 'chore(data): refresh medical code datasets'
          body: |
            Automated refresh of ICD-9, ICD-10, ATC5, HCPCS Level II, CVX and ICD-9↔ICD-10 crosswalk datasets.

            - Updated source metadata and deterministic JSON outputs
            - ICD-10 filtered to valid-for-coding (VALID=1) codes only
            - Rebuilt SQLite artifact for app consumption
            - Included refresh report with added/removed/changed counts
          add-paths: |
            data/vocabularies/atc5.json
            data/vocabularies/icd9.json
            data/vocabularies/icd10.json
            data/vocabularies/hcpcs.json
            data/vocabularies/cvx.json
            data/vocabularies/source-metadata.json
            data/vocabularies/icd9_to_icd10_gem.json
          delete-branch: true
