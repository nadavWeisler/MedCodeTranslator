[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medcodetranslator"
version = "0.1.0"
description = "Python client for MedCodeTranslator biomedical terminology retrieval"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "MedCodeTranslator Contributors" }]
keywords = ["medical", "terminology", "loinc", "icd10", "atc", "search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "rapidfuzz>=3.0",
]

[project.urls]
Homepage = "https://github.com/nadavWeisler/MedCodeTranslator"
Repository = "https://github.com/nadavWeisler/MedCodeTranslator"
Documentation = "https://github.com/nadavWeisler/MedCodeTranslator/tree/dev/docs"

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["medcodetranslator*"]
