[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "medcodetranslator"
version = "0.1.0"
description = "Python client for MedCodeTranslator biomedical terminology retrieval"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "rapidfuzz>=3.0",
]

[project.urls]
Homepage = "https://github.com/nadavWeisler/MedCodeTranslator"

[tool.setuptools.packages.find]
where = ["."]
