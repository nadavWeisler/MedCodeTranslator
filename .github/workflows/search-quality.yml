name: Search quality benchmark

on:
  pull_request:
    branches: [master, dev]
    paths:
      - 'assets/data/**'
      - 'app/services/fuzzySearch.ts'
      - 'db/queries.ts'
  push:
    branches: [master, dev]
    paths:
      - 'assets/data/**'
      - 'app/services/fuzzySearch.ts'
      - 'db/queries.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run search precision benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run search quality benchmark
        run: node agents/search-benchmarker/run_benchmark.js

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-report
          path: build/search-quality/
          if-no-files-found: warn
