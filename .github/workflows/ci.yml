name: CI

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set web base path
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "dev" ]; then
            echo "MEDCODE_BASE_URL=/MedCodeTranslator/dev" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "MEDCODE_BASE_URL=/MedCodeTranslator/dev" >> "$GITHUB_ENV"
          else
            echo "MEDCODE_BASE_URL=/MedCodeTranslator" >> "$GITHUB_ENV"
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --no-coverage --ci

      - name: Build web
        run: npm run build:web

      - name: Run search benchmarks
        run: npm run benchmark
        continue-on-error: true   # don't fail CI — surface report as artifact

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-report
          path: build/search-quality/benchmark-report.json
          if-no-files-found: ignore
