branches:
  - name: master
    protection:
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        required_approving_review_count: 1
      required_status_checks:
        strict: true
        contexts:
          - "CI / validate"
          - "Accessibility Review / audit"
      enforce_admins: false
      required_linear_history: true
      required_conversation_resolution: true
      allow_force_pushes: false
      allow_deletions: false
      restrictions: null
  - name: main
    protection:
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        required_approving_review_count: 1
      required_status_checks:
        strict: true
        contexts:
          - "CI / validate"
          - "Accessibility Review / audit"
      enforce_admins: false
      required_linear_history: true
      required_conversation_resolution: true
      allow_force_pushes: false
      allow_deletions: false
      restrictions: null
labels:
  - name: "type: bug"
    color: "d73a4a"
    description: "Something in the product or workflow is broken."
  - name: "type: feature"
    color: "a2eeef"
    description: "A scoped product or workflow enhancement."
  - name: "type: data"
    color: "1d76db"
    description: "A terminology dataset, mapping, or refresh issue."
  - name: "type: docs"
    color: "0075ca"
    description: "Documentation, policy, or contributor-guidance work."
  - name: "type: ci"
    color: "5319e7"
    description: "Build, deployment, or automation pipeline work."
  - name: "area: web"
    color: "fbca04"
    description: "Web app behavior, build, or deployment."
  - name: "area: mobile"
    color: "f9d0c4"
    description: "iOS, Android, or shared mobile workflow work."
  - name: "area: search"
    color: "0e8a16"
    description: "Lookup, search results, suggestions, or UI flow."
  - name: "area: dataset"
    color: "bfd4f2"
    description: "Bundled medical data, source refreshes, or mappings."
  - name: "area: compliance"
    color: "c5def5"
    description: "Safe-scope, legal, privacy, or compliance review."
  - name: "priority: P1"
    color: "b60205"
    description: "Urgent work that is release-blocking or high risk."
  - name: "priority: P2"
    color: "d93f0b"
    description: "Important work that should be prioritized soon."
  - name: "priority: P3"
    color: "fbca04"
    description: "Routine backlog work."
  - name: "needs-triage"
    color: "ededed"
    description: "Awaiting label review, prioritization, or scoping."
